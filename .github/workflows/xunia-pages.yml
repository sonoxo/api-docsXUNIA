name: Deploy XUNIA Product Hub

on:
  push:
    branches: [gh-pages]
    paths:
      - "xunia-site/**"
      - ".github/workflows/xunia-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: xunia-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload XUNIA static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: xunia-site
      - name: Deploy XUNIA to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
